{% extends "src/layouts/base.html" %}

{% block title %}AI Chat - Task Board{% endblock %}

{% block content %}
<div class="page-title">
  <h1>AI Chat</h1>
  <p>AI에게 메시지를 보내고 현재 대화 응답을 확인합니다.</p>
</div>

<section class="panel chat-shell d-flex flex-column">
  <div id="chatMessages" class="chat-messages flex-fill p-4">
    <div class="chat-bubble ai mb-3">
      챗 어시스턴트입니다. 무엇을 도와드릴까요?
    </div>
  </div>
  <form id="chatForm" class="border-top p-3">
    <div class="input-group">
      <input id="chatInput" class="form-control" type="text" placeholder="메시지를 입력하세요" autocomplete="off">
      <button class="btn btn-primary" type="submit">전송</button>
    </div>
  </form>
</section>
{% endblock %}

{% block scripts %}
  <script type="module" src="/js/page_chat.js"></script>
{% endblock %}
