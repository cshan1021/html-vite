<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}html vite 프로젝트{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="app-header">
    <div class="app-container d-flex align-items-center justify-content-between">
      <a class="navbar-brand fw-semibold text-white" href="/index.html">html vite 프로젝트</a>
      <span class="text-white-50 small">작업 관리 및 AI 대화 서비스</span>
    </div>
  </header>

  <div class="app-shell app-container">
    <aside class="app-sidebar">
      <div class="sidebar-title">메뉴</div>
      <nav class="sidebar-nav">
        <a href="/board/list.html">
          <i class="bi bi-list-task"></i>
          <span>게시판</span>
        </a>
        <a href="/chat/chat.html">
          <i class="bi bi-chat-dots"></i>
          <span>AI CHAT</span>
        </a>
      </nav>
    </aside>

    <main id="main-content">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
